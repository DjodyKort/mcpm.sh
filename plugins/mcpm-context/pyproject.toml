[project]
name = "mcpm-context"
version = "0.1.0"
description = "Layered Claude context (org/personal/per-client) + full CLAUDE_CONFIG_DIR profiles, coexisting with cf-dev-tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]
# Note: `mcpm` itself is intentionally NOT a dependency. This plugin is loaded
# via the `mcpm.plugins` entry point INTO mcpm's own environment, so mcpm and
# its core APIs (GlobalConfigManager, ClaudeCodeManager) are already importable.

[project.entry-points."mcpm.plugins"]
context = "mcpm_context.cli:context"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpm_context"]

[tool.ruff]
line-length = 120
target-version = "py310"
